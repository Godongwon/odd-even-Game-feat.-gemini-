<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>홀짝.GO - 실시간 주사위 배틀</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Paho MQTT WebSocket Client (글로벌 고가용성 실시간 양방향 WSS 라이브러리) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap');
    
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input {
      user-select: text;
      font-size: 16px !important; /* iOS 포커스 시 줌인 방지 */
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }

    /* 주사위 회전 애니메이션 */
    @keyframes dice-roll-spin {
      0% { transform: rotate(0deg) scale(0.9); }
      50% { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .animate-dice {
      animation: dice-roll-spin 0.25s infinite linear;
    }

    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }

    /* 반응 이모지 플로팅 애니메이션 */
    @keyframes float-reaction {
      0% { transform: translateY(0) scale(0.7); opacity: 1; }
      100% { transform: translateY(-90px) scale(1.3); opacity: 0; }
    }
    .reaction-bubble {
      position: absolute;
      animation: float-reaction 1.3s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      pointer-events: none;
      z-index: 50;
    }

    /* 부드러운 아코디언 애니메이션 */
    .chat-accordion {
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease-in-out;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen lg:h-screen lg:overflow-hidden flex flex-col justify-between selection:bg-indigo-500 selection:text-white relative">

  <!-- 반응 이모지 렌더 컨테이너 -->
  <div id="reactionContainer" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

  <!-- 토스트 알림 컨테이너 -->
  <div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

  <!-- 상단 네비게이션 헤더 -->
  <header class="w-full bg-slate-900/90 border-b border-slate-800/80 backdrop-blur-md px-4 py-2.5 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center shadow-lg shadow-amber-500/20 text-white font-black text-xl">
        🎲
      </div>
      <div class="flex flex-col">
        <span class="text-lg font-black tracking-tight bg-gradient-to-r from-amber-400 via-rose-400 to-cyan-400 bg-clip-text text-transparent">
          홀짝.GO
        </span>
      </div>
    </div>

    <!-- 통합 실시간 상태 캡슐 UI (WS 상태 + 실시간 액션 티커) -->
    <div id="integratedStatusBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800/90 border border-slate-700/80 shadow-inner max-w-[260px] sm:max-w-xs md:max-w-md transition-all">
      <span id="wsStatusDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shrink-0"></span>
      <span id="wsStatusText" class="text-xs font-semibold text-slate-300 shrink-0">연결 대기 중</span>
      <span class="w-[1px] h-3 bg-slate-700 shrink-0 mx-0.5"></span>
      <span id="liveTickerText" class="text-xs text-amber-300 font-medium truncate">대기실 준비 중</span>
    </div>

    <!-- 우측 프로필/방 상태 -->
    <div class="flex items-center gap-2">
      <div id="roomBadge" class="hidden items-center gap-1.5 px-2.5 py-1 rounded-lg bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-xs font-bold font-mono-num">
        <i data-lucide="hash" class="w-3.5 h-3.5"></i>
        <span id="lblRoomCode">------</span>
      </div>
      <button id="btnLeaveRoom" class="hidden items-center gap-1 px-2.5 py-1 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 text-xs font-bold transition-colors">
        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">나가기</span>
      </button>
    </div>
  </header>

  <!-- 메인 뷰포트 영역 -->
  <main class="w-full flex-1 max-w-7xl mx-auto p-2 sm:p-4 grid grid-cols-1 lg:grid-cols-12 gap-3 sm:gap-4 overflow-y-auto lg:overflow-hidden">
    
    <!-- 좌측/중앙: 로비(방 생성/입장) OR 게임 아레나 -->
    <section class="lg:col-span-8 flex flex-col gap-3 lg:h-full lg:overflow-y-auto pr-0 lg:pr-1">
      
      <!-- [화면 1] 로비 뷰 (입장 전) -->
      <div id="viewLobby" class="flex-1 flex flex-col items-center justify-center min-h-[460px] p-6 rounded-2xl bg-slate-900/60 border border-slate-800/80 shadow-2xl relative">
        <div class="max-w-md w-full space-y-6">
          <div class="text-center space-y-2">
            <h1 class="text-3xl font-black text-white tracking-tight">실시간 멀티 배틀</h1>
            <p class="text-slate-400 text-sm">초저지연 웹소켓 기반 1:다 홀짝 서바이벌 아레나</p>
          </div>

          <div class="space-y-4 bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1.5">닉네임</label>
              <input type="text" id="inputNickname" maxlength="10" placeholder="닉네임 입력 (최대 10자)"
                     class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors font-medium">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
              <button id="btnCreateRoom" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                새 방 만들기
              </button>
              <button id="btnOpenJoinModal" class="w-full py-3 px-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-sm shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                코드로 입장
              </button>
            </div>
          </div>

          <!-- 로비 안내 팁 -->
          <div class="p-3.5 rounded-xl bg-slate-800/20 border border-slate-800 text-xs text-slate-400 flex items-start gap-2.5">
            <i data-lucide="info" class="w-4 h-4 text-indigo-400 shrink-0 mt-0.5"></i>
            <span>모바일과 PC 간 실시간 교차 동기화가 지원됩니다. 친구에게 방 링크나 6자리 코드를 공유하세요!</span>
          </div>
        </div>
      </div>

      <!-- [화면 2] 게임 아레나 뷰 (입장 후) -->
      <div id="viewGame" class="hidden flex-1 flex flex-col gap-3 min-h-[500px]">
        
        <!-- 상단 라운드 & 상태 배너 -->
        <div class="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800/80 flex items-center justify-between shrink-0 shadow-lg">
          <div class="flex items-center gap-3">
            <div class="px-3 py-1 rounded-lg bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 font-extrabold text-xs font-mono-num">
              ROUND <span id="lblRoundNum">1</span>
            </div>
            <div class="flex items-center gap-2">
              <span id="badgeGamePhase" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                대기 중
              </span>
              <span id="lblPhaseTimer" class="text-xs text-slate-400 font-mono-num font-bold"></span>
            </div>
          </div>

          <!-- 방 링크 복사 버튼 -->
          <div class="flex items-center gap-2">
            <button id="btnCopyInvite" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold flex items-center gap-1.5 transition-colors">
              <i data-lucide="share-2" class="w-3.5 h-3.5 text-indigo-400"></i>
              <span>초대 링크</span>
            </button>
          </div>
        </div>

        <!-- 중앙 주사위 롤링 & 결과 디스플레이 -->
        <div class="flex-1 rounded-2xl bg-slate-900/60 border border-slate-800/80 flex flex-col items-center justify-center p-6 relative overflow-hidden shadow-xl min-h-[220px]">
          <!-- 배경 글로우 이펙트 -->
          <div class="absolute w-64 h-64 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none -top-10 -left-10"></div>
          <div class="absolute w-64 h-64 bg-rose-600/10 rounded-full blur-3xl pointer-events-none -bottom-10 -right-10"></div>

          <!-- 주사위 비주얼 박스 -->
          <div class="relative z-10 flex flex-col items-center gap-3">
            <div id="diceVisualBox" class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-gradient-to-br from-slate-800 to-slate-900 border-2 border-slate-700 flex items-center justify-center shadow-2xl transition-transform duration-300">
              <span id="diceFace" class="text-5xl sm:text-6xl font-black text-amber-400 font-mono-num select-none">?</span>
            </div>

            <!-- 결과 라벨 -->
            <div class="text-center space-y-1">
              <div id="lblDiceResultText" class="text-xl sm:text-2xl font-black text-slate-200 tracking-tight">
                배팅 대기 중
              </div>
              <div id="lblDiceSubText" class="text-xs font-semibold text-slate-400">
                원하는 선택지(홀/짝)와 칩을 결정하세요
              </div>
            </div>
          </div>
        </div>

        <!-- 하단 배팅 컨트롤 패널 -->
        <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800/80 flex flex-col gap-3 shrink-0 shadow-lg">
          <!-- 상단: 내 칩 잔고 & 배팅액 설정 -->
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-400">내 보유 칩:</span>
              <span id="lblMyChips" class="text-base font-extrabold text-amber-400 font-mono-num">1,000</span>
              <span id="lblSpectatorBadge" class="hidden px-2 py-0.5 rounded text-[10px] font-extrabold bg-rose-500/20 text-rose-300 border border-rose-500/40">
                관전 모드 (파산)
              </span>
            </div>

            <!-- 배팅 금액 퀵 버튼 -->
            <div id="betAmountControls" class="flex items-center gap-1.5 flex-wrap">
              <button data-bet="100" class="btn-bet-chip px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-300 transition-colors">100</button>
              <button data-bet="500" class="btn-bet-chip px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-300 transition-colors">500</button>
              <button data-bet="1000" class="btn-bet-chip px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-300 transition-colors">1K</button>
              <button id="btnBetAllIn" class="px-2.5 py-1 rounded-lg bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 text-xs font-extrabold text-rose-300 transition-colors">ALL-IN</button>
              <input type="number" id="inputCustomBet" value="100" min="10" step="10"
                     class="w-20 px-2 py-1 rounded-lg bg-slate-950 border border-slate-700 text-xs font-mono-num text-right text-amber-300 font-bold focus:outline-none focus:border-amber-500">
            </div>
          </div>

          <!-- 홀 / 짝 선택 버튼 (이스터에그 장치 내장) -->
          <div class="grid grid-cols-2 gap-3 pt-1">
            <button id="btnBetOdd" class="relative group py-4 px-4 rounded-xl bg-gradient-to-r from-amber-500/20 to-amber-600/10 hover:from-amber-500/30 hover:to-amber-600/20 border-2 border-amber-500/40 hover:border-amber-400 text-amber-300 font-black text-lg transition-all shadow-lg active:scale-[0.98] flex items-center justify-center gap-2">
              <span class="text-xl">⚡</span>
              <span>홀 (ODD)</span>
              <span id="badgeMyBetOdd" class="hidden absolute top-2 right-2 px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 text-[10px] font-black">선택됨</span>
            </button>
            <button id="btnBetEven" class="relative group py-4 px-4 rounded-xl bg-gradient-to-r from-cyan-500/20 to-cyan-600/10 hover:from-cyan-500/30 hover:to-cyan-600/20 border-2 border-cyan-500/40 hover:border-cyan-400 text-cyan-300 font-black text-lg transition-all shadow-lg active:scale-[0.98] flex items-center justify-center gap-2">
              <span class="text-xl">❄️</span>
              <span>짝 (EVEN)</span>
              <span id="badgeMyBetEven" class="hidden absolute top-2 right-2 px-2 py-0.5 rounded-full bg-cyan-400 text-slate-950 text-[10px] font-black">선택됨</span>
            </button>
          </div>

          <!-- 방장/플레이어 액션 영역 (시작하기 / 준비완료 / 봇 추가) -->
          <div id="hostAndReadyArea" class="pt-1 flex items-center justify-between flex-wrap gap-2 border-t border-slate-800/80">
            <!-- 방장 전용 봇 제어 버튼 -->
            <div id="hostBotControls" class="flex items-center gap-2">
              <button id="btnAddBot" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-bold transition-colors flex items-center gap-1">
                <i data-lucide="bot" class="w-3.5 h-3.5 text-indigo-400"></i>
                + 봇 추가
              </button>
              <button id="btnRemoveBot" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700 text-xs font-bold transition-colors">
                - 봇 제거
              </button>
            </div>

            <!-- 상태별 메인 액션 버튼 -->
            <div class="flex items-center gap-2 ml-auto">
              <!-- 방장 전용: 게임 시작 버튼 -->
              <button id="btnHostStartRound" class="hidden px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm shadow-lg shadow-emerald-600/30 active:scale-[0.98] transition-all flex items-center gap-1.5">
                <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                라운드 시작하기
              </button>
              <!-- 게스트 전용: 준비완료 토글 버튼 -->
              <button id="btnGuestToggleReady" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-sm shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all flex items-center gap-1.5">
                <i data-lucide="check-circle" class="w-4 h-4"></i>
                <span>준비 완료 (READY)</span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- 우측: 참가자 현황 + 드롭다운형 실시간 채팅 & 이모지 퀵바 -->
    <section class="lg:col-span-4 flex flex-col gap-3 lg:h-full lg:overflow-hidden">
      
      <!-- 1. 참가자 현황 및 리더보드 -->
      <div class="rounded-2xl bg-slate-900/80 border border-slate-800/80 flex flex-col shadow-lg overflow-hidden shrink-0 lg:flex-1 lg:min-h-0">
        <div class="p-3 border-b border-slate-800/80 flex items-center justify-between bg-slate-900/90 shrink-0">
          <div class="flex items-center gap-2">
            <i data-lucide="users" class="w-4 h-4 text-indigo-400"></i>
            <span class="text-xs font-black text-slate-200">참가자 현황</span>
            <span id="lblPlayerCount" class="px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 text-[10px] font-mono-num font-bold">1</span>
          </div>
          <span class="text-[11px] font-bold text-slate-400">랭킹 / 상태</span>
        </div>

        <div id="playerListContainer" class="p-2 space-y-1.5 overflow-y-auto max-h-[190px] lg:max-h-none flex-1">
          <!-- 플레이어 아이템이 동적으로 렌더링됩니다 -->
        </div>
      </div>

      <!-- 2. 드롭다운형 실시간 채팅 + 항상 노출되는 이모지 퀵 반응바 -->
      <div class="rounded-2xl bg-slate-900/80 border border-slate-800/80 flex flex-col shadow-lg overflow-hidden shrink-0">
        
        <!-- 항상 노출되는 이모지 반응 퀵바 (접혀 있어도 언제든 반응 가능) -->
        <div class="px-3 py-2 bg-slate-800/50 border-b border-slate-800/80 flex items-center justify-between gap-1 shrink-0">
          <span class="text-[11px] font-bold text-slate-400 shrink-0 mr-1">반응</span>
          <div class="flex items-center gap-1.5 overflow-x-auto py-0.5">
            <button data-emoji="🔥" class="btn-send-emoji w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-90 transition-all flex items-center justify-center text-sm shadow">🔥</button>
            <button data-emoji="👏" class="btn-send-emoji w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-90 transition-all flex items-center justify-center text-sm shadow">👏</button>
            <button data-emoji="😭" class="btn-send-emoji w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-90 transition-all flex items-center justify-center text-sm shadow">😭</button>
            <button data-emoji="🎲" class="btn-send-emoji w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-90 transition-all flex items-center justify-center text-sm shadow">🎲</button>
            <button data-emoji="💰" class="btn-send-emoji w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-90 transition-all flex items-center justify-center text-sm shadow">💰</button>
            <button data-emoji="👍" class="btn-send-emoji w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-90 transition-all flex items-center justify-center text-sm shadow">👍</button>
          </div>
        </div>

        <!-- 채팅 헤더 (클릭 시 아코디언 토글) -->
        <div id="chatAccordionHeader" class="p-3 flex items-center justify-between cursor-pointer hover:bg-slate-800/40 transition-colors select-none">
          <div class="flex items-center gap-2">
            <i data-lucide="message-square" class="w-4 h-4 text-cyan-400"></i>
            <span class="text-xs font-black text-slate-200">실시간 채팅</span>
          </div>
          <div class="flex items-center gap-1.5 text-slate-400 text-xs">
            <span id="chatToggleText" class="text-[11px] font-semibold text-slate-500">열기</span>
            <i id="chatChevron" data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-300"></i>
          </div>
        </div>

        <!-- 닫혀 있는 상태: 최근 3개 메시지만 노출되는 미니 피드 -->
        <div id="chatMiniBox" class="px-3 pb-2.5 pt-0 space-y-1">
          <div id="chatMiniList" class="space-y-1 text-[11px]">
            <div class="text-slate-500 italic">아직 수신된 메시지가 없습니다.</div>
          </div>
        </div>

        <!-- 펼쳐진 상태: 전체 채팅 히스토리 및 입력창 -->
        <div id="chatExpandedPanel" class="hidden flex-col border-t border-slate-800/80 bg-slate-950/40">

  <!-- 애플리케이션 핵심 로직 및 Paho MQTT 실시간 웹소켓 파이프라인 -->
  <script>
    /* ==========================================================================
       1. 전역 상태 (Reactive Store)
       ========================================================================== */
    const EASTER_EGG_TARGETS = ['고동원', '고끼리', '강다인'];

    const store = {
      myId: 'usr_' + Math.random().toString(36).substring(2, 9),
      nickname: '',
      roomCode: null,
      isHost: false,
      isReady: false,
      isSpectator: false,
      chips: 1000,
      currentBet: 0,
      chosenChoice: null, // 'ODD' | 'EVEN' | null
      round: 1,
      phase: 'WAITING', // 'WAITING' | 'BETTING' | 'ROLLING' | 'RESULT'
      diceNumber: null,
      timerSeconds: 0,
      players: [],
      chatMessages: [],
      isChatExpanded: false,
      isNetConnected: false,
      // 이스터에그 비밀 조작 변수 (1: 홀, 2: 짝, 0: 일반 난수)
      secretRigChoice: 0
    };

    /* ==========================================================================
       2. DOM 참조 캐시 (el)
       ========================================================================== */
    const el = {
      integratedStatusBadge: document.getElementById('integratedStatusBadge'),
      wsStatusDot: document.getElementById('wsStatusDot'),
      wsStatusText: document.getElementById('wsStatusText'),
      liveTickerText: document.getElementById('liveTickerText'),
      roomBadge: document.getElementById('roomBadge'),
      lblRoomCode: document.getElementById('lblRoomCode'),
      btnLeaveRoom: document.getElementById('btnLeaveRoom'),
      viewLobby: document.getElementById('viewLobby'),
      viewGame: document.getElementById('viewGame'),
      inputNickname: document.getElementById('inputNickname'),
      btnCreateRoom: document.getElementById('btnCreateRoom'),
      btnOpenJoinModal: document.getElementById('btnOpenJoinModal'),
      modalJoinRoom: document.getElementById('modalJoinRoom'),
      btnCloseJoinModal: document.getElementById('btnCloseJoinModal'),
      inputJoinCode: document.getElementById('inputJoinCode'),
      btnSubmitJoin: document.getElementById('btnSubmitJoin'),
      btnCopyInvite: document.getElementById('btnCopyInvite'),
      lblRoundNum: document.getElementById('lblRoundNum'),
      badgeGamePhase: document.getElementById('badgeGamePhase'),
      lblPhaseTimer: document.getElementById('lblPhaseTimer'),
      diceVisualBox: document.getElementById('diceVisualBox'),
      diceFace: document.getElementById('diceFace'),
      lblDiceResultText: document.getElementById('lblDiceResultText'),
      lblDiceSubText: document.getElementById('lblDiceSubText'),
      lblMyChips: document.getElementById('lblMyChips'),
      lblSpectatorBadge: document.getElementById('lblSpectatorBadge'),
      btnBetOdd: document.getElementById('btnBetOdd'),
      btnBetEven: document.getElementById('btnBetEven'),
      badgeMyBetOdd: document.getElementById('badgeMyBetOdd'),
      badgeMyBetEven: document.getElementById('badgeMyBetEven'),
      btnBetAllIn: document.getElementById('btnBetAllIn'),
      inputCustomBet: document.getElementById('inputCustomBet'),
      hostBotControls: document.getElementById('hostBotControls'),
      btnAddBot: document.getElementById('btnAddBot'),
      btnRemoveBot: document.getElementById('btnRemoveBot'),
      btnHostStartRound: document.getElementById('btnHostStartRound'),
      btnGuestToggleReady: document.getElementById('btnGuestToggleReady'),
      playerListContainer: document.getElementById('playerListContainer'),
      lblPlayerCount: document.getElementById('lblPlayerCount'),
      chatAccordionHeader: document.getElementById('chatAccordionHeader'),
      chatToggleText: document.getElementById('chatToggleText'),
      chatChevron: document.getElementById('chatChevron'),
      chatMiniBox: document.getElementById('chatMiniBox'),
      chatMiniList: document.getElementById('chatMiniList'),
      chatExpandedPanel: document.getElementById('chatExpandedPanel'),
      chatMessagesList: document.getElementById('chatMessagesList'),
      chatForm: document.getElementById('chatForm'),
      inputChatMessage: document.getElementById('inputChatMessage'),
      reactionContainer: document.getElementById('reactionContainer'),
      toastContainer: document.getElementById('toastContainer')
    };

    /* ==========================================================================
       3. 네트워킹 엔진 (Paho MQTT WebSocket over SSL/WSS)
       ========================================================================== */
    let mqttClient = null;
    let localBroadcastChannel = null;
    let syncHeartbeatTimer = null;
    let phaseCountInterval = null;
    const processedPacketIds = new Set();

    // 공인 글로벌 브로커 클러스터
    const MQTT_BROKERS = [
      { host: 'broker.emqx.io', port: 8084, path: '/mqtt' },
      { host: 'broker.hivemq.com', port: 8884, path: '/mqtt' }
    ];
    let currentBrokerIndex = 0;

    function initNetworking(roomCode) {
      destroyNetworking();

      // 동일 기기 탭 간 즉각 통신용 로컬 채널
      try {
        localBroadcastChannel = new BroadcastChannel('hz_room_' + roomCode);
        localBroadcastChannel.onmessage = (e) => handleNetworkMessage(e.data);
      } catch (err) {
        console.warn('BroadcastChannel 미지원:', err);
      }

      connectMqttBroker(roomCode);
    }

    function connectMqttBroker(roomCode) {
      updateNetworkBadge('CONNECTING', 'WS 연결 중...');
      const broker = MQTT_BROKERS[currentBrokerIndex];
      const clientId = 'hz_client_' + store.myId + '_' + Math.random().toString(16).substr(2, 6);

      try {
        mqttClient = new Paho.MQTT.Client(broker.host, broker.port, broker.path, clientId);

        mqttClient.onConnectionLost = (responseObject) => {
          console.warn('WSS 연결 해제:', responseObject.errorMessage);
          store.isNetConnected = false;
          updateNetworkBadge('DISCONNECTED', 'WS 재연결 시도...');
          
          // 브로커 순환 폴백
          currentBrokerIndex = (currentBrokerIndex + 1) % MQTT_BROKERS.length;
          setTimeout(() => {
            if (store.roomCode) connectMqttBroker(store.roomCode);
          }, 2000);
        };

        mqttClient.onMessageArrived = (message) => {
          try {
            const packet = JSON.parse(message.payloadString);
            handleNetworkMessage(packet);
          } catch (err) {
            console.error('패킷 역직렬화 실패:', err);
          }
        };

        mqttClient.connect({
          useSSL: true,
          timeout: 4,
          keepAliveInterval: 20,
          cleanSession: true,
          onSuccess: () => {
            store.isNetConnected = true;
            updateNetworkBadge('CONNECTED', 'WS 온라인 (' + roomCode + ')');
            const topic = 'hz_arena_room/' + roomCode;
            mqttClient.subscribe(topic, { qos: 0 });

            // 입장 알림 발송 (0ms, 400ms 2회)
            broadcastPacket({
              t: 'JOIN',
              id: store.myId,
              name: store.nickname,
              isHost: store.isHost,
              chips: store.chips
            });
            setTimeout(() => {
              if (store.roomCode === roomCode) {
                broadcastPacket({
                  t: 'JOIN',
                  id: store.myId,
                  name: store.nickname,
                  isHost: store.isHost,
                  chips: store.chips
                });
              }
            }, 400);

            // 방장인 경우 주기적 하트비트 동기화 가동
            if (store.isHost) {
              startHostHeartbeat();
            }
          },
          onFailure: (err) => {
            console.warn('WSS 브로커 접속 지연:', err);
            store.isNetConnected = false;
            updateNetworkBadge('DISCONNECTED', 'WS 재시도...');
            currentBrokerIndex = (currentBrokerIndex + 1) % MQTT_BROKERS.length;
            setTimeout(() => {
              if (store.roomCode) connectMqttBroker(store.roomCode);
            }, 2500);
          }
        });
      } catch (err) {
        console.error('MQTT 클라이언트 생성 실패:', err);
      }
    }

    function destroyNetworking() {
      if (syncHeartbeatTimer) {
        clearInterval(syncHeartbeatTimer);
        syncHeartbeatTimer = null;
      }
      if (localBroadcastChannel) {
        try { localBroadcastChannel.close(); } catch(e){}
        localBroadcastChannel = null;
      }
      if (mqttClient) {
        try {
          if (mqttClient.isConnected()) {
            mqttClient.unsubscribe('hz_arena_room/' + store.roomCode);
            mqttClient.disconnect();
          }
        } catch(e){}
        mqttClient = null;
      }
      store.isNetConnected = false;
    }

    function broadcastPacket(data) {
      const packet = {
        ...data,
        _pid: 'pkt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        _snd: store.myId,
        _rm: store.roomCode
      };

      // 로컬 동일 브라우저 채널 브로드캐스트
      if (localBroadcastChannel) {
        try { localBroadcastChannel.postMessage(packet); } catch(e){}
      }

      // WSS 브로커 브로드캐스트
      if (mqttClient && mqttClient.isConnected()) {
        try {
          const message = new Paho.MQTT.Message(JSON.stringify(packet));
          message.destinationName = 'hz_arena_room/' + store.roomCode;
          message.qos = 0;
          mqttClient.send(message);
        } catch (e) {
          console.warn('소켓 전송 실패:', e);
        }
      }
    }

    function handleNetworkMessage(packet) {
      if (!packet || !packet._pid || packet._snd === store.myId) return;
      if (processedPacketIds.has(packet._pid)) return;
      processedPacketIds.add(packet._pid);
      if (processedPacketIds.size > 400) {
        const first = processedPacketIds.values().next().value;
        processedPacketIds.delete(first);
      }

      switch (packet.t) {
        case 'JOIN': {
          handlePlayerJoin(packet);
          break;
        }
        case 'LEAVE': {
          handlePlayerLeave(packet.id);
          break;
        }
        case 'HOST_MIGRATE': {
          handleHostMigrate(packet);
          break;
        }
        case 'SYNC': {
          handleRoomSync(packet);
          break;
        }
        case 'BET': {
          handlePlayerBet(packet);
          break;
        }
        case 'READY': {
          handlePlayerReady(packet);
          break;
        }
        case 'ROLL_START': {
          triggerRollingVisual(packet.sec || 4);
          break;
        }
        case 'ROLL_RESULT': {
          finalizeDiceResult(packet.dice, packet.payouts);
          break;
        }
        case 'REACTION': {
          createReactionBubble(packet.emoji);
          break;
        }
        case 'CHAT': {
          appendChatMessage(packet.name, packet.text, false, packet.isSys);
          break;
        }
      }
    }

    /* ==========================================================================
       4. 방장 승계 및 플레이어 수명주기 핸들러
       ========================================================================== */
    function handlePlayerJoin(packet) {
      let p = store.players.find(x => x.id === packet.id);
      const isNewUser = !p;

      if (!p) {
        p = {
          id: packet.id,
          name: packet.name,
          chips: packet.chips || 1000,
          isHost: !!packet.isHost,
          isReady: false,
          betChoice: null,
          betAmount: 0,
          streak: 0,
          isBot: false
        };
        store.players.push(p);

        // 요구사항 2: 새 플레이어 입장 시 시스템 채팅 출력
        appendChatMessage('시스템', `${packet.name}님이 입장하였습니다.`, false, true);
        triggerTicker(`${packet.name} 님 입장`);
      } else {
        p.name = packet.name;
        p.chips = packet.chips || p.chips;
      }

      renderPlayers();

      // 방장은 새 참가자에게 현재 룸 상태 즉시 주입
      if (store.isHost) {
        sendRoomSync();
      }
    }

    function handlePlayerLeave(leftPlayerId) {
      const idx = store.players.findIndex(x => x.id === leftPlayerId);
      if (idx === -1) return;

      const leftPlayer = store.players[idx];
      store.players.splice(idx, 1);
      appendChatMessage('시스템', `${leftPlayer.name}님이 퇴장하였습니다.`, false, true);
      triggerTicker(`${leftPlayer.name} 님 퇴장`);

      // 방장이 나간 경우: 방에 남아있는 첫 번째 실제 유저가 새 방장으로 자동 승계
      if (leftPlayer.isHost) {
        migrateHost();
      }

      renderPlayers();
    }

    function migrateHost() {
      // 봇을 제외한 실제 유저 중 첫 번째 유저 선출
      const nextHostCandidate = store.players.find(p => !p.isBot);

      if (nextHostCandidate) {
        nextHostCandidate.isHost = true;

        if (nextHostCandidate.id === store.myId) {
          // 내가 새로운 방장으로 승격!
          store.isHost = true;
          store.isReady = true;
          showToast('👑 당신이 새로운 방장이 되었습니다!');
          triggerTicker('방장 권한 승계');
          startHostHeartbeat();

          broadcastPacket({
            t: 'HOST_MIGRATE',
            newHostId: store.myId,
            newHostName: store.nickname
          });

          sendRoomSync();
        } else {
          showToast(`👑 ${nextHostCandidate.name} 님이 새 방장이 되었습니다.`);
        }
      }
      renderControls();
    }

    function handleHostMigrate(packet) {
      store.players.forEach(p => {
        p.isHost = (p.id === packet.newHostId);
      });
      store.isHost = (store.myId === packet.newHostId);
      showToast(`👑 ${packet.newHostName} 님이 새로운 방장이 되었습니다.`);
      renderControls();
      renderPlayers();
    }

    function startHostHeartbeat() {
      if (syncHeartbeatTimer) clearInterval(syncHeartbeatTimer);
      syncHeartbeatTimer = setInterval(() => {
        if (store.isHost && store.roomCode) {
          sendRoomSync();
        }
      }, 700);
    }

    function sendRoomSync() {
      broadcastPacket({
        t: 'SYNC',
        round: store.round,
        phase: store.phase,
        timer: store.timerSeconds,
        players: store.players
      });
    }

    function handleRoomSync(packet) {
      if (store.isHost) return; // 방장은 자체 권한 유지

      store.round = packet.round;
      store.phase = packet.phase;
      store.timerSeconds = packet.timer;

      // 플레이어 리스트 병합
      if (packet.players && Array.isArray(packet.players)) {
        store.players = packet.players;
        const me = store.players.find(p => p.id === store.myId);
        if (me) {
          store.chips = me.chips;
          store.isReady = me.isReady;
          store.chosenChoice = me.betChoice;
          store.currentBet = me.betAmount;
        }
      }

      renderPhaseState();
      renderPlayers();
      renderControls();
    }

    /* ==========================================================================
       5. 게임 플레이 및 배팅 로직 (이스터에그 및 IO 규칙)
       ========================================================================== */
    function handlePlayerBet(packet) {
      const p = store.players.find(x => x.id === packet.id);
      if (p) {
        p.betChoice = packet.choice;
        p.betAmount = packet.amount;
        renderPlayers();
        triggerTicker(`${p.name}: ${packet.choice === 'ODD' ? '홀' : '짝'} 배팅 완료`);
      }
    }

    function handlePlayerReady(packet) {
      const p = store.players.find(x => x.id === packet.id);
      if (p) {
        p.isReady = packet.isReady;
        renderPlayers();
      }
    }

    function placeBet(choice) {
      if (store.phase !== 'WAITING' && store.phase !== 'BETTING') {
        showToast('배팅 가능한 단계가 아닙니다.');
        return;
      }
      if (store.chips <= 0) {
        showToast('보유 칩이 없어 관전 모드 상태입니다.');
        return;
      }

      const betInput = parseInt(el.inputCustomBet.value, 10);
      const amount = Math.min(Math.max(betInput || 100, 10), store.chips);

      store.chosenChoice = choice;
      store.currentBet = amount;

      // 내 플레이어 데이터 갱신
      const me = store.players.find(p => p.id === store.myId);
      if (me) {
        me.betChoice = choice;
        me.betAmount = amount;
      }

      broadcastPacket({
        t: 'BET',
        id: store.myId,
        choice: choice,
        amount: amount
      });

      renderControls();
      renderPlayers();
      showToast(`${choice === 'ODD' ? '홀' : '짝'}에 ${amount.toLocaleString()} 칩 배팅!`);
    }

    /* ==========================================================================
       6. 주사위 롤링 및 결과 판정 (이스터에그 내장)
       ========================================================================== */
    function startRoundCountdown() {
      if (!store.isHost) return;

      store.phase = 'BETTING';
      store.timerSeconds = 5;
      sendRoomSync();
      renderPhaseState();

      if (phaseCountInterval) clearInterval(phaseCountInterval);
      phaseCountInterval = setInterval(() => {
        store.timerSeconds--;
        if (store.timerSeconds <= 0) {
          clearInterval(phaseCountInterval);
          rollDiceAuthoritative();
        } else {
          sendRoomSync();
          renderPhaseState();
        }
      }, 1000);
    }

    function rollDiceAuthoritative() {
      store.phase = 'ROLLING';
      broadcastPacket({ t: 'ROLL_START', sec: 3 });
      triggerRollingVisual(3);

      setTimeout(() => {
        let finalDice = 1;

        // 이스터에그 판정: 대상 닉네임 유저의 조작값 우선 확인
        if (store.secretRigChoice === 1) {
          // 홀수 강제 (1, 3, 5 중 랜덤)
          const odds = [1, 3, 5];
          finalDice = odds[Math.floor(Math.random() * odds.length)];
        } else if (store.secretRigChoice === 2) {
          // 짝수 강제 (2, 4, 6 중 랜덤)
          const evens = [2, 4, 6];
          finalDice = evens[Math.floor(Math.random() * evens.length)];
        } else {
          // 일반 공정 난수
          finalDice = Math.floor(Math.random() * 6) + 1;
        }

        // 결과 배당 계산
        const isOdd = (finalDice % 2 !== 0);
        const winningChoice = isOdd ? 'ODD' : 'EVEN';

        const payouts = {};
        store.players.forEach(p => {
          if (p.betChoice && p.betAmount > 0) {
            if (p.betChoice === winningChoice) {
              p.chips += p.betAmount;
              p.streak = (p.streak || 0) + 1;
              payouts[p.id] = { win: true, delta: p.betAmount };
            } else {
              p.chips = Math.max(0, p.chips - p.betAmount);
              p.streak = 0;
              payouts[p.id] = { win: false, delta: -p.betAmount };
            }
          }
          // 배팅 초기화
          p.betChoice = null;
          p.betAmount = 0;
          p.isReady = false;
        });

        broadcastPacket({
          t: 'ROLL_RESULT',
          dice: finalDice,
          payouts: payouts
        });

        finalizeDiceResult(finalDice, payouts);
      }, 3000);
    }

    function triggerRollingVisual(durationSec) {
      store.phase = 'ROLLING';
      renderPhaseState();
      el.diceFace.textContent = '🎲';
      el.diceVisualBox.classList.add('animate-dice');
      el.lblDiceResultText.textContent = '주사위 굴리는 중...';
      el.lblDiceSubText.textContent = '운명의 결과가 결정됩니다!';
    }

    function finalizeDiceResult(diceNumber, payouts) {
      el.diceVisualBox.classList.remove('animate-dice');
      el.diceFace.textContent = diceNumber;

      const isOdd = (diceNumber % 2 !== 0);
      const resultText = isOdd ? '홀 (ODD)' : '짝 (EVEN)';
      el.lblDiceResultText.innerHTML = `<span class="${isOdd ? 'text-amber-400' : 'text-cyan-400'} font-black">${diceNumber} - ${resultText}!</span>`;

      // 내 정산 확인
      const myPayout = payouts ? payouts[store.myId] : null;
      if (myPayout) {
        if (myPayout.win) {
          showToast(`🎉 승리! +${myPayout.delta.toLocaleString()} 칩 획득!`);
          triggerTicker(`${store.nickname} 승리 (+${myPayout.delta})`);
        } else {
          showToast(`💀 패배! ${myPayout.delta.toLocaleString()} 칩 차감`);
          triggerTicker(`${store.nickname} 패배 (${myPayout.delta})`);
        }
      }

      // 파산 검사
      if (store.chips <= 0) {
        store.isSpectator = true;
        showToast('칩이 모두 소진되어 관전 모드로 전환되었습니다.');
        triggerTicker(`${store.nickname} 파산 (관전 전환)`);
      }

      store.phase = 'RESULT';
      store.round++;
      renderPhaseState();
      renderControls();
      renderPlayers();

      // 다음 라운드 대기 전환
      setTimeout(() => {
        store.phase = 'WAITING';
        store.chosenChoice = null;
        store.currentBet = 0;
        store.secretRigChoice = 0; // 이스터에그 리셋
        renderPhaseState();
        renderControls();
      }, 3500);
    }

    /* ==========================================================================
       7. UI 렌더링 서브루틴
       ========================================================================== */
    function updateNetworkBadge(status, text) {
      el.wsStatusText.textContent = text;
      if (status === 'CONNECTED') {
        el.wsStatusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0';
      } else if (status === 'CONNECTING') {
        el.wsStatusDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shrink-0';
      } else {
        el.wsStatusDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0';
      }
    }

    function triggerTicker(msg) {
      el.liveTickerText.textContent = msg;
    }

    function renderPhaseState() {
      el.lblRoundNum.textContent = store.round;

      if (store.phase === 'WAITING') {
        el.badgeGamePhase.textContent = '참가자 준비 중';
        el.badgeGamePhase.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700';
        el.lblPhaseTimer.textContent = '';
      } else if (store.phase === 'BETTING') {
        el.badgeGamePhase.textContent = '배팅 진행 중';
        el.badgeGamePhase.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 animate-pulse';
        el.lblPhaseTimer.textContent = `${store.timerSeconds}s`;
      } else if (store.phase === 'ROLLING') {
        el.badgeGamePhase.textContent = '주사위 롤링 중';
        el.badgeGamePhase.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30';
        el.lblPhaseTimer.textContent = '';
      } else if (store.phase === 'RESULT') {
        el.badgeGamePhase.textContent = '라운드 종료';
        el.badgeGamePhase.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
        el.lblPhaseTimer.textContent = '';
      }
    }

    function renderControls() {
      el.lblMyChips.textContent = store.chips.toLocaleString();
      el.lblSpectatorBadge.classList.toggle('hidden', !store.isSpectator);

      // 선택 뱃지
      el.badgeMyBetOdd.classList.toggle('hidden', store.chosenChoice !== 'ODD');
      el.badgeMyBetEven.classList.toggle('hidden', store.chosenChoice !== 'EVEN');

      // 방장 전용 UI
      el.btnHostStartRound.classList.toggle('hidden', !store.isHost);
      el.hostBotControls.classList.toggle('hidden', !store.isHost);

      // 게스트 전용 준비 버튼
      el.btnGuestToggleReady.classList.toggle('hidden', store.isHost);
      if (!store.isHost) {
        if (store.isReady) {
          el.btnGuestToggleReady.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> 준비 완료 해제';
          el.btnGuestToggleReady.className = 'px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-black text-sm border border-slate-700 active:scale-[0.98] transition-all flex items-center gap-1.5';
        } else {
          el.btnGuestToggleReady.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4"></i> 준비 완료 (READY)';
          el.btnGuestToggleReady.className = 'px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-sm shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all flex items-center gap-1.5';
        }
      }

      lucide.createIcons();
    }

    function renderPlayers() {
      el.lblPlayerCount.textContent = store.players.length;
      el.playerListContainer.innerHTML = '';

      // 칩 내림차순 정렬 (리더보드)
      const sorted = [...store.players].sort((a, b) => b.chips - a.chips);

      sorted.forEach((p, idx) => {
        const isMe = (p.id === store.myId);
        const card = document.createElement('div');
        card.className = `p-2 rounded-xl border flex items-center justify-between text-xs transition-colors ${
          isMe ? 'bg-indigo-950/40 border-indigo-500/40' : 'bg-slate-800/40 border-slate-800'
        }`;

        const streakBadge = (p.streak >= 2) ? `<span class="px-1.5 py-0.2 rounded bg-rose-500/20 text-rose-300 font-black text-[10px]">🔥${p.streak}</span>` : '';
        const hostBadge = p.isHost ? `<span class="px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300 font-extrabold text-[10px]">방장</span>` : '';
        const readyBadge = (!p.isHost && p.isReady) ? `<span class="px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300 font-extrabold text-[10px]">준비됨</span>` : '';
        const betBadge = p.betChoice ? `<span class="px-1.5 py-0.2 rounded ${p.betChoice === 'ODD' ? 'bg-amber-500/20 text-amber-300' : 'bg-cyan-500/20 text-cyan-300'} font-bold text-[10px]">${p.betChoice === 'ODD' ? '홀' : '짝'}</span>` : '';

        card.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <span class="font-mono-num font-bold text-slate-500 w-4">${idx + 1}</span>
            <span class="font-bold text-slate-200 truncate ${isMe ? 'text-indigo-300' : ''}">${p.name} ${isMe ? '(나)' : ''}</span>
            ${hostBadge}
            ${streakBadge}
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            ${betBadge}
            ${readyBadge}
            <span class="font-mono-num font-extrabold text-amber-400">${p.chips.toLocaleString()}</span>
          </div>
        `;
        el.playerListContainer.appendChild(card);
      });
    }

    /* ==========================================================================
       8. 채팅 및 이모지 반응 시스템 (드롭다운 & 미니피드 3개)
       ========================================================================== */
    function toggleChatAccordion() {
      store.isChatExpanded = !store.isChatExpanded;
      el.chatExpandedPanel.classList.toggle('hidden', !store.isChatExpanded);
      el.chatToggleText.textContent = store.isChatExpanded ? '접기' : '열기';
      el.chatChevron.style.transform = store.isChatExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
      if (store.isChatExpanded) {
        el.inputChatMessage.focus();
        scrollChatToBottom();
      }
    }

    function appendChatMessage(name, text, isMe = false, isSys = false) {
      const msgObj = { name, text, isMe, isSys, time: new Date() };
      store.chatMessages.push(msgObj);
      if (store.chatMessages.length > 50) store.chatMessages.shift();

      // 1. 전체 확장창 렌더링
      const msgDiv = document.createElement('div');
      if (isSys) {
        msgDiv.className = 'py-1 px-2 rounded-lg bg-slate-800/60 text-slate-400 text-[11px] text-center font-medium';
        msgDiv.textContent = `📢 [시스템] ${text}`;
      } else {
        msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
        msgDiv.innerHTML = `
          <span class="text-[10px] text-slate-400 font-bold mb-0.5">${name}</span>
          <div class="px-2.5 py-1.5 rounded-xl text-xs max-w-[85%] break-words ${
            isMe ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-800 text-slate-200 rounded-tl-none'
          }">${escapeHtml(text)}</div>
        `;
      }
      el.chatMessagesList.appendChild(msgDiv);
      scrollChatToBottom();

      // 2. 접힌 상태의 미니 피드 3개 렌더링
      renderChatMiniList();
    }

    function renderChatMiniList() {
      const recent3 = store.chatMessages.slice(-3);
      if (recent3.length === 0) {
        el.chatMiniList.innerHTML = '<div class="text-slate-500 italic">아직 수신된 메시지가 없습니다.</div>';
        return;
      }

      el.chatMiniList.innerHTML = recent3.map(m => {
        if (m.isSys) {
          return `<div class="truncate text-slate-400 font-medium">📢 [시스템] ${escapeHtml(m.text)}</div>`;
        }
        return `
          <div class="truncate">
            <span class="font-bold ${m.isMe ? 'text-indigo-400' : 'text-slate-300'}">${escapeHtml(m.name)}:</span>
            <span class="text-slate-400">${escapeHtml(m.text)}</span>
          </div>
        `;
      }).join('');
    }

    function scrollChatToBottom() {
      el.chatMessagesList.scrollTop = el.chatMessagesList.scrollHeight;
    }

    function createReactionBubble(emoji) {
      const bubble = document.createElement('div');
      bubble.className = 'reaction-bubble text-3xl select-none';
      bubble.textContent = emoji;

      // 무작위 X 좌표
      const randomX = Math.floor(Math.random() * (window.innerWidth - 60)) + 30;
      const startY = window.innerHeight - 120;
      bubble.style.left = `${randomX}px`;
      bubble.style.top = `${startY}px`;

      el.reactionContainer.appendChild(bubble);
      setTimeout(() => bubble.remove(), 1300);
    }

    function sendReaction(emoji) {
      createReactionBubble(emoji);
      broadcastPacket({
        t: 'REACTION',
        emoji: emoji
      });
    }

    /* ==========================================================================
       9. 룸 생성 / 입장 / 나가기
       ========================================================================== */
    function createRoom() {
      const nickname = el.inputNickname.value.trim() || generateRandomNickname();
      store.nickname = nickname;
      store.roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
      store.isHost = true;
      store.isReady = true;

      store.players = [{
        id: store.myId,
        name: store.nickname,
        chips: 1000,
        isHost: true,
        isReady: true,
        streak: 0,
        betChoice: null,
        betAmount: 0
      }];

      initNetworking(store.roomCode);
      enterGameView();
      showToast(`방을 생성했습니다. 코드: ${store.roomCode}`);
    }

    function joinRoom(code) {
      const roomCode = (code || el.inputJoinCode.value).trim().toUpperCase();
      if (!roomCode || roomCode.length < 4) {
        showToast('유효한 6자리 룸 코드를 입력해주세요.');
        return;
      }

      const nickname = el.inputNickname.value.trim() || generateRandomNickname();
      store.nickname = nickname;
      store.roomCode = roomCode;
      store.isHost = false;
      store.isReady = false;

      store.players = [{
        id: store.myId,
        name: store.nickname,
        chips: 1000,
        isHost: false,
        isReady: false,
        streak: 0,
        betChoice: null,
        betAmount: 0
      }];

      initNetworking(store.roomCode);
      closeJoinModal();
      enterGameView();
      showToast(`${roomCode} 방에 참가 중입니다...`);
    }

    function leaveRoom() {
      if (confirm('현재 게임 방에서 퇴장하시겠습니까?')) {
        broadcastPacket({
          t: 'LEAVE',
          id: store.myId
        });
        destroyNetworking();

        // 룸 상태 리셋
        store.roomCode = null;
        store.isHost = false;
        store.isReady = false;
        store.players = [];
        store.chatMessages = [];

        el.viewGame.classList.add('hidden');
        el.viewLobby.classList.remove('hidden');
        el.roomBadge.classList.add('hidden');
        el.btnLeaveRoom.classList.add('hidden');
        updateNetworkBadge('WAITING', '연결 대기 중');
        triggerTicker('대기실 준비 중');
      }
    }

    function enterGameView() {
      el.viewLobby.classList.add('hidden');
      el.viewGame.classList.remove('hidden');
      el.roomBadge.classList.remove('hidden');
      el.lblRoomCode.textContent = store.roomCode;
      el.btnLeaveRoom.classList.remove('hidden');

      renderControls();
      renderPlayers();
      renderPhaseState();
      renderChatMiniList();
    }

    /* ==========================================================================
       10. 이스터에그 (고동원, 고끼리, 강다인)
       ========================================================================== */
    function checkAndApplyEasterEgg(choiceType) {
      // 대상자 여부 확인
      if (EASTER_EGG_TARGETS.includes(store.nickname.trim())) {
        if (choiceType === 'SINGLE_CLICK') {
          // 배팅 1클릭 -> 홀(ODD) 강제 설정
          store.secretRigChoice = 1;
        } else if (choiceType === 'DOUBLE_CLICK') {
          // 배팅 더블클릭 -> 짝(EVEN) 강제 설정
          store.secretRigChoice = 2;
        }
      }
    }

    /* ==========================================================================
       11. 봇 추가/제거 (방장 전용)
       ========================================================================== */
    function addBot() {
      if (!store.isHost) return;
      const botNames = ['알파고', '럭키봇', '주사위장인', '베팅봇', '홀짝AI'];
      const randomName = botNames[Math.floor(Math.random() * botNames.length)] + '_' + Math.floor(Math.random() * 90 + 10);
      
      const newBot = {
        id: 'bot_' + Math.random().toString(36).substr(2, 7),
        name: randomName,
        chips: 1000,
        isHost: false,
        isReady: true,
        streak: 0,
        betChoice: Math.random() > 0.5 ? 'ODD' : 'EVEN',
        betAmount: 100,
        isBot: true
      };

      store.players.push(newBot);
      renderPlayers();
      sendRoomSync();
      showToast(`${randomName} 봇이 추가되었습니다.`);
    }

    function removeBot() {
      if (!store.isHost) return;
      const botIdx = store.players.findIndex(p => p.isBot);
      if (botIdx !== -1) {
        const removed = store.players.splice(botIdx, 1)[0];
        renderPlayers();
        sendRoomSync();
        showToast(`${removed.name} 봇을 제거했습니다.`);
      } else {
        showToast('제거할 봇이 없습니다.');
      }
    }

    /* ==========================================================================
       12. 유틸리티 함수
       ========================================================================== */
    function generateRandomNickname() {
      const adj = ['신속한', '용감한', '행운의', '날카로운', '즐거운', '화려한'];
      const nouns = ['주사위', '게이머', '승부사', '플레이어', '러너', '마스터'];
      return adj[Math.floor(Math.random() * adj.length)] + nouns[Math.floor(Math.random() * nouns.length)] + Math.floor(Math.random() * 90 + 10);
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'px-4 py-2 rounded-xl bg-slate-900/90 border border-slate-700 text-white text-xs font-bold shadow-2xl backdrop-blur-md transition-all duration-300';
      toast.textContent = msg;
      el.toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    function openJoinModal() {
      el.modalJoinRoom.classList.remove('hidden');
      el.modalJoinRoom.classList.add('flex');
      el.inputJoinCode.focus();
    }

    function closeJoinModal() {
      el.modalJoinRoom.classList.add('hidden');
      el.modalJoinRoom.classList.remove('flex');
    }

    /* ==========================================================================
       13. 이벤트 리스너 바인딩
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      el.inputNickname.value = generateRandomNickname();

      // URL 파라미터 방 코드 확인
      const urlParams = new URLSearchParams(window.location.search);
      const inviteCode = urlParams.get('room');
      if (inviteCode) {
        joinRoom(inviteCode);
      }

      // 로비 버튼
      el.btnCreateRoom.addEventListener('click', createRoom);
      el.btnOpenJoinModal.addEventListener('click', openJoinModal);
      el.btnCloseJoinModal.addEventListener('click', closeJoinModal);
      el.btnSubmitJoin.addEventListener('click', () => joinRoom());
      el.btnLeaveRoom.addEventListener('click', leaveRoom);

      // 초대 링크 복사
      el.btnCopyInvite.addEventListener('click', () => {
        const url = `${window.location.origin}${window.location.pathname}?room=${store.roomCode}`;
        navigator.clipboard.writeText(url).then(() => {
          showToast('초대 링크가 클립보드에 복사되었습니다!');
        }).catch(() => {
          prompt('초대 링크를 복사하세요:', url);
        });
      });

      // 배팅 금액 퀵 버튼
      document.querySelectorAll('.btn-bet-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          el.inputCustomBet.value = btn.getAttribute('data-bet');
        });
      });
      el.btnBetAllIn.addEventListener('click', () => {
        el.inputCustomBet.value = store.chips;
      });

      // 홀 / 짝 배팅 버튼 (1클릭 / 더블클릭 이스터에그 리스너)
      let clickTimerOdd = null;
      el.btnBetOdd.addEventListener('click', () => {
        if (clickTimerOdd) {
          clearTimeout(clickTimerOdd);
          clickTimerOdd = null;
          checkAndApplyEasterEgg('DOUBLE_CLICK');
        } else {
          checkAndApplyEasterEgg('SINGLE_CLICK');
          clickTimerOdd = setTimeout(() => { clickTimerOdd = null; }, 300);
        }
        placeBet('ODD');
      });

      let clickTimerEven = null;
      el.btnBetEven.addEventListener('click', () => {
        if (clickTimerEven) {
          clearTimeout(clickTimerEven);
          clickTimerEven = null;
          checkAndApplyEasterEgg('DOUBLE_CLICK');
        } else {
          checkAndApplyEasterEgg('SINGLE_CLICK');
          clickTimerEven = setTimeout(() => { clickTimerEven = null; }, 300);
        }
        placeBet('EVEN');
      });

      // 방장/게스트 제어
      el.btnHostStartRound.addEventListener('click', startRoundCountdown);
      el.btnGuestToggleReady.addEventListener('click', () => {
        store.isReady = !store.isReady;
        const me = store.players.find(p => p.id === store.myId);
        if (me) me.isReady = store.isReady;
        broadcastPacket({
          t: 'READY',
          id: store.myId,
          isReady: store.isReady
        });
        renderControls();
        renderPlayers();
      });

      // 봇 제어
      el.btnAddBot.addEventListener('click', addBot);
      el.btnRemoveBot.addEventListener('click', removeBot);

      // 채팅 아코디언 토글
      el.chatAccordionHeader.addEventListener('click', toggleChatAccordion);

      // 채팅 전송
      el.chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = el.inputChatMessage.value.trim();
        if (!text) return;
        el.inputChatMessage.value = '';

        appendChatMessage(store.nickname, text, true, false);
        broadcastPacket({
          t: 'CHAT',
          name: store.nickname,
          text: text,
          isSys: false
        });
      });

      // 이모지 반응 버튼
      document.querySelectorAll('.btn-send-emoji').forEach(btn => {
        btn.addEventListener('click', () => {
          sendReaction(btn.getAttribute('data-emoji'));
        });
      });
    });
  </script>
</body>
</html>
